<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Catflap 猫洞 单色">
  <title>Catflap 猫洞 · 01 单色版（浅底用）</title>
  <defs>
    <mask id="a-mono-cut">
      <rect width="512" height="512" fill="#000"/>
      <path d="M156 428V236a100 100 0 0 1 200 0v192z" fill="#fff"/>
      <path d="M204 428v-46a52 52 0 0 1 104 0v46z" fill="#000"/>
    </mask>
  </defs>

  <!-- 门体挖空活门 -->
